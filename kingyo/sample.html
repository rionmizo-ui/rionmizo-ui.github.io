<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金魚の最期 見本</title>
<style>
:root { color-scheme: light dark; --bg: light-dark(#e9f3ef, #102624); --wall: light-dark(#1d4d4a, #0b1c1b); --ink: light-dark(#173b39, #dff3ee);
--card: light-dark(#fff8e6, #183533); --sub: light-dark(#4b6b68, #9cc2bc); --or: #f0862e; --red: #d9534a; }
:root[data-theme=light] { color-scheme: light } :root[data-theme=dark] { color-scheme: dark }
* { box-sizing: border-box; min-width: 0 }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 "M PLUS Rounded 1c", system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; overflow-x: clip }
header { padding: clamp(20px, 3vw, 40px) max(4vw, 16px) 8px; max-width: 1400px; margin: 0 auto }
h1 { font-size: clamp(28px, 4vw, 44px); line-height: 1.1; margin: 0 0 6px; text-wrap: balance }
header p { margin: 0; color: var(--sub); max-width: 62ch }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px max(4vw, 16px) 4px; max-width: 1400px; margin: 0 auto }
.tabs button { font: inherit; font-weight: 700; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid var(--wall); background: transparent; color: var(--ink); cursor: pointer }
.tabs button[aria-pressed=true] { background: var(--wall); color: #fff8e6 }
.tabs button:focus-visible, .tank:focus-visible { outline: 3px solid var(--or); outline-offset: 3px }
main { padding: 16px max(4vw, 16px) 48px; max-width: 1400px; margin: 0 auto }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 18px }
.tank { all: unset; cursor: pointer; display: flex; flex-direction: column; background: var(--wall); border-radius: 14px; padding: 8px; box-shadow: 0 4px 0 rgba(0,0,0,.25) }
.tank canvas { width: 100%; aspect-ratio: 2/3; image-rendering: pixelated; border-radius: 6px; display: block; background: #5fcfb8 }
.label { display: flex; gap: 8px; align-items: baseline; padding: 8px 4px 2px; color: #fff8e6 }
.no { font-weight: 800; color: var(--or); font-variant-numeric: tabular-nums; flex: none }
.nm { font-weight: 700; font-size: 15px; line-height: 1.3 }
.how { color: #a9cfc8; font-size: 13px; line-height: 1.4; padding: 0 4px 4px }
.big { position: fixed; inset: 0; background: rgba(8,20,19,.82); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 5 }
.big.on { display: flex }
.big .box { background: var(--wall); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 100%; }
.big canvas { height: min(78vh, 720px); aspect-ratio: 2/3; image-rendering: pixelated; border-radius: 8px; display: block }
.big .label { padding: 0 4px }
.big button { font: inherit; font-weight: 700; min-height: 44px; border-radius: 10px; border: 0; background: #fff8e6; color: #173b39; cursor: pointer }
.note { color: var(--sub); font-size: 13px; margin-top: 24px }
.pager { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px }
.pager button { font: inherit; font-weight: 700; min-height: 44px; min-width: 64px; padding: 0 14px; border-radius: 10px; border: 2px solid var(--wall); background: transparent; color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums }
.pager button[aria-pressed=true] { background: var(--wall); color: #fff8e6 }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">

<body>
<header>
<h1>金魚の最期（v23）48種と、ふれあい・イベント・しぐさ</h1>
<p>ゲーム本体と同じ演出を、水槽ごとにくり返し再生しています（軽くするため1ページ12個ずつ・見えている水槽だけ動きます）。最期は、ぽちゃんと入る→最期→網で回収→札まで。しぐさは、ひまなときに金魚がするものです。押すと大きく見られます。</p>
</header>
<div class="tabs" role="group" aria-label="絞り込み">
<button id="t-all" aria-pressed="true">すべて</button>
<button id="t-sudden" aria-pressed="false">育成途中の突然死</button>
<button id="t-ending" aria-pressed="false">満タン時の結末</button>
<button id="t-touch" aria-pressed="false">ふれあい・芸</button>
<button id="t-event" aria-pressed="false">イベント</button>
<button id="t-gesture" aria-pressed="false">しぐさ・お客さん・かざり</button>
</div>
<main>
<div class="grid" id="grid"></div>
<p class="note">見本では事故を必ず起こしています（書いてある％は今の値）。v20：世話3回ごとに金魚が「ひと休み」して、しぐさやお客さんを見せてくれます。放っておいても6秒ごとに少しずつ育ちます。満タン時の結末は、当てはまるものの中から重みつきの抽選で決まります。まだ図鑑にない結末は2倍出やすくなります。</p>
</main>
