<title>きんぎょ デザイン帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* LAYOUT: 左に目次、右に「標本の台紙」の格子。1枚の台紙＝1つの絵（大きく・ドットのまま） */
  :root {
    --paper: #f3f6f2; --sheet: #ffffff; --ink: #183a37; --sub: #557370; --line: #d5e2de; --accent: #e06a12; --water: #5fcfb8; --cream: #fff8e8;
    --f-disp: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    --f-body: "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #0f1f1e; --sheet: #162b29; --ink: #e2f2ee; --sub: #9bbdb7; --line: #284542; --accent: #ffa25a; color-scheme: dark } }
  :root[data-theme="dark"] { --paper: #0f1f1e; --sheet: #162b29; --ink: #e2f2ee; --sub: #9bbdb7; --line: #284542; --accent: #ffa25a; color-scheme: dark }
  * { box-sizing: border-box }
  body { background: var(--paper); color: var(--ink); font: 15px/1.6 var(--f-body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px }
  .wrap { max-width: 1240px; margin: 0 auto }
  header { padding-block: 28px 8px }
  h1 { font: 800 clamp(26px, 3.6vw, 40px)/1.15 var(--f-disp); margin: 0 0 6px; text-wrap: balance }
  header p { margin: 0; color: var(--sub); max-width: 68ch }
  nav.toc { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding-block: 10px; margin-top: 14px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap }
  nav.toc a { font-weight: 800; font-size: 13px; color: var(--ink); text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--sheet) }
  nav.toc a:hover, nav.toc a:focus-visible { border-color: var(--accent); outline: none }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper) }
  section { padding-block: 26px 4px; scroll-margin-top: 64px }
  h2 { font: 800 22px/1.3 var(--f-disp); margin: 0 0 4px; display: flex; gap: 10px; align-items: baseline }
  h2 small { font: 500 13px var(--f-body); color: var(--sub) }
  .lead { color: var(--sub); margin: 0 0 14px; max-width: 72ch }
  h3 { font: 800 15px/1.4 var(--f-disp); margin: 18px 0 8px; color: var(--sub); letter-spacing: .02em }
  /* すべて同じ倍率（ドット1つ＝3px。水槽まるごとは2px）で描くので、大きさを見比べられる */
  .grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start }
  .plate { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: 100% }
  .plate canvas { height: auto; image-rendering: pixelated; image-rendering: crisp-edges; border-radius: 6px; display: block; max-width: 100% }
  .nm { font-weight: 800; font-size: 14px; line-height: 1.35 }
  .fn { font: 500 11px/1.4 var(--f-mono); color: var(--sub); overflow-wrap: anywhere }
  .note { font-size: 12px; color: var(--sub); line-height: 1.45 }
  .strip { background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 12px; min-width: 0 }
  .strip .sc { overflow-x: auto }
  .strip canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; border-radius: 6px }
  .strip .row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px }
  .shots figure { margin: 0; background: var(--sheet); border: 1px solid var(--line); border-radius: 10px; padding: 8px }
  .shots img { width: 100%; image-rendering: pixelated; border-radius: 6px; display: block }
  .shots figcaption { font-weight: 800; font-size: 14px; margin-top: 6px }
  .tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: #fff }
  .ctrl { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--sub); margin-top: 10px }
  .ctrl button { font: inherit; font-weight: 800; border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; min-height: 36px }
  .ctrl button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
  footer { color: var(--sub); font-size: 13px; margin-top: 32px }

</style>
<div class="wrap">
  <header>
    <h1>きんぎょのさいご デザイン帳</h1>
    <p>死に方（カード・死に際の動き・死因アイコン）以外の絵を、ゲームと同じ描画コードで1つずつ大きく描いた一覧です。動くものは動いています。名前の下は、その絵を描く関数（Codex に頼むときの呼び名）です。</p>
    <div class="ctrl"><button id="play" aria-pressed="true">動きを止める</button><span id="count"></span></div>
  </header>
  <nav class="toc" aria-label="目次" id="toc"></nav>
  <main id="main"></main>
  <footer>v23 時点。芸・しぐさ・イベントの「動きの流れ」は見本ページ（金魚の最期 見本）で見られます。死に方のデザインはデザイン作り直しセットの ref/ にあります。</footer>
</div>

    sc.blocks.forEach(b => {
      if (b.h3) { const h = document.createElement('h3'); h.textContent = b.h3; el.appendChild(h); }
      if (b.type === 'strip') {
        const d = document.createElement('div'); d.className = 'strip';
        d.innerHTML = `<div class="row"><span class="note">${b.note}</span></div><div class="sc"></div>`;
        const cv = document.createElement('canvas'); cv.width = b.cellW * b.frames.length; cv.height = b.cellH;
        cv.style.width = Math.min(b.cellW * b.frames.length * 3, 1200) + 'px';
        const c = cv.getContext('2d'); c.imageSmoothingEnabled = false;
        b.frames.forEach((o, i) => { c.fillStyle = i & 1 ? '#56c4ae' : b.bg; c.fillRect(i * b.cellW, 0, b.cellW, b.cellH); S.drawFish(c, i * b.cellW + b.cellW / 2, b.cellH / 2 + 2, Object.assign({}, o)); c.fillStyle = '#1d4d4a'; c.font = '8px sans-serif'; c.fillText(b.labelFn(i), i * b.cellW + 3, 9); });
        d.querySelector('.sc').appendChild(cv); el.appendChild(d); total += b.frames.length; return;
      }
      const g = document.createElement('div'); g.className = 'grid'; g.style.setProperty('--cw', (b.cw || 150) + 'px');
      b.items.forEach(([nm, fn, note, w, h, draw, bg, anim]) => {
        const p = document.createElement('figure'); p.className = 'plate'; p.style.margin = '0';
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const k = w >= 150 && h > 100 ? 2 : w <= 40 ? 4 : 3; cv.style.width = (w * k) + 'px'; p.style.width = Math.max(w * k + 18, 140) + 'px';
        p.appendChild(cv);
        p.insertAdjacentHTML('beforeend', `<figcaption><div class="nm">${nm}</div><div class="fn">${fn}</div>${note ? `<div class="note">${note}</div>` : ''}</figcaption>`);
        g.appendChild(p);
        const c = cv.getContext('2d'); c.imageSmoothingEnabled = false;
        const item = { c, w, h, draw, bg, anim, vis: false };
        item.paint = t => { c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, w, h); if (bg) { c.fillStyle = bg; c.fillRect(0, 0, w, h); } try { draw(c, t); } catch (e) { c.fillStyle = '#c00'; c.fillText('!', 4, 12); } };
        item.paint(0.4); live.push(item); cv._item = item; total++;
      });
      el.appendChild(g);
    });
  });
  document.getElementById('count').textContent = '絵の数：' + total;
  // 見えているものだけ動かす（1秒12コマ）
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.target._item) e.target._item.vis = e.isIntersecting; }), { rootMargin: '100px' });
  live.forEach(it => io.observe(it.c.canvas));
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reduce, last = -1;
  const btn = document.getElementById('play');
  const setBtn = () => { btn.textContent = playing ? '動きを止める' : '動かす'; btn.setAttribute('aria-pressed', String(playing)); };
  setBtn(); btn.addEventListener('click', () => { playing = !playing; setBtn(); });
  function tick(now) {
    const f = Math.floor(now / 1000 * 12);
    if (playing && f !== last) { last = f; const t = f / 12; for (const it of live) if (it.anim && it.vis) it.paint(t); }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
